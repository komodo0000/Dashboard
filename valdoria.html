<style>
:root{--bg:#f4efe6;--card:#fffaf0;--ink:#2a2118;--mut:#7a6a58;--acc:#8b3a1e;--hp:#c0392b;--mp:#2e6fb7;--bd:#d9ccb6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#241d16;--ink:#efe5d3;--mut:#a39682;--acc:#e0884f;--hp:#e5604f;--mp:#5aa0e8;--bd:#3d3326}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--acc)}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.act{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.bar{height:9px;border-radius:5px;background:var(--bd);overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;transition:width .3s}
.lbl{font-size:.85rem;display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:10px;margin:2px 4px 0 0;border:1px solid}
.ok{color:var(--mp)}.bad{color:var(--hp)}
button{display:block;width:100%;text-align:left;font:inherit;padding:12px 14px;margin-top:8px;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--ink);cursor:pointer}
button:active{background:var(--acc);color:var(--bg)}
button:disabled{opacity:.4}
button small{display:block;color:var(--mut);font-size:.8rem}
#log{max-height:130px;overflow-y:auto;font-size:.9rem;color:var(--mut);line-height:1.5;margin-top:6px}
p{line-height:1.55;margin:0 0 8px}
.art{font:14px/1.15 ui-monospace,Menlo,Consolas,monospace;margin:4px 0 8px;white-space:pre;overflow-x:auto;color:var(--ink)}
</style>
</head>

function end(){
 const f=S.fl,t=["O Dragão Ignis solta um último rugido e desaba. O Cristal do Sol volta a brilhar sobre Valdoria."];
 if(f.band_p)t.push("O ex-bandido que você poupou ajuda a carregar o cristal de volta.");
 if(f.elfa)t.push("A elfa que você libertou canta uma bênção que cura as terras queimadas.");
 if(f.aldeoes)t.push("Os aldeões do pântano preparam um banquete em sua honra.");
 if(f.filhote)t.push("O lobo que você criou uiva de alegria ao seu lado.");
 t.push(f.sombrio?"Mas o poder sombrio do cristal ainda arde em você e Valdoria teme o herói que a salvou. 🌑":S.k>=3?"Por todas as suas escolhas justas, você é coroado Protetor de Valdoria. 👑":S.k>=0?"Valdoria está salva e você é celebrado como herói. 🎉":"O reino foi salvo, mas as suas ações cruéis deixam o povo com medo de você.");
 story("Final",t,[["🔁 Jogar de novo",start]],{e:"crystal",h:"^^",g:" * * "});
}
function scene(o){
 o=o||{};
 const hl=A[S.c].split("\n").map(l=>l.replace("@@",o.h||"oo").padEnd(12));
 const el=o.e&&B[o.e]?B[o.e].split("\n").map(l=>l.replace("@@",o.f||"oo")):[];
 while(el.length<7)el.unshift("");
 const g=(o.g||"").padEnd(5).slice(0,5);
 const p=BG2[S.b||0],R=l=>l.repeat(3);
 return [p[0],...p.slice(1,5).map(R),hl.map((l,i)=>l+(i==3?g:"     ")+el[i]).join("\n"),...p.slice(5).map(R)].join("\n").replace(/&/g,"&amp;").replace(/</g,"&lt;");
}
let S={},app=document.getElementById("app");
function h(){const c=C[S.c];return`<div class="lbl"><span>${c.e} ${c.n}</span><span>🧪 ${S.pot} · 🍖 ${S.sup}</span></div><div class="lbl"><span>❤️ Vida</span><span>${S.hp}/${S.mhp}</span></div><div class="bar"><i style="width:${S.hp/S.mhp*100}%;background:var(--hp)"></i></div><div class="lbl"><span>🔷 Magia</span><span>${S.mp}/${c.mp}</span></div><div class="bar"><i style="width:${S.mp/c.mp*100}%;background:var(--mp)"></i></div>${S.fx.map(f=>`<span class="tag ${X[f.id].bad?"bad":"ok"}">${X[f.id].e} ${X[f.id].n}: ${X[f.id].t} (${f.left}x)</span>`).join("")}`}
function story(act,txt,btns,o){
 app.innerHTML=`${S.c?`<div class="card"><pre class="art">${scene(o)}</pre></div>`:""}<div class="card"><div class="act">${act}</div>${txt.map(t=>`<p>${t}</p>`).join("")}</div>${S.c?`<div class="card">${h()}</div>`:""}`+btns.map((b,i)=>`<button data-i="${i}">${b[0]}</button>`).join("");
 app.querySelectorAll("button").forEach(el=>el.onclick=()=>btns[el.dataset.i][1]());
}
function start(){
 S={};
 story("Início",["Há muito tempo, o Dragão Ignis queimou as plantações de Valdoria e roubou o Cristal do Sol, que mantinha o reino em paz.","O prefeito da aldeia chama você: “Só um herói pode recuperar o cristal. Quem é você?”"],
  Object.keys(C).map(k=>[`${C[k].e} <b>${C[k].n}</b> <small>${C[k].d} · ${C[k].hp} de vida, ${C[k].mp} de magia</small>`,()=>pick(k)]));
}
function pick(c){S={c,hp:C[c].hp,mhp:C[c].hp,mp:C[c].mp,pot:2,fx:[],i:0,eq:{},fl:{},k:0,sup:4};go()}
function go(){let s;do{s=Q[S.i++]}while((s.y&&!s.y.every(f=>S.fl[f]))||(s.n&&s.n.some(f=>S.fl[f])));({s:sc,f:(s)=>fight(s.k),q:qu,r:re,w:end})[s.t](s)}
function sc(s){S.b=s.b;story(s.a,s.x,[["Continuar",go]])}
function qu(s){story("Missão secundária · "+s.ti,s.x,s.o.map(o=>[o.l,()=>qres(o)]),{e:"quest"})}
function qres(o){
 const u=Array.isArray(o.out)?o.out[Math.random()<.5?0:1]:o.out;
 if(u.cost&&S.pot<u.cost)return story("Missão secundária",["Você não tem poções suficientes para isso."],[["Continuar",go]],{e:"quest"});S.pot-=u.cost||0;(u.fl||[]).forEach(f=>S.fl[f]=1);S.k+=u.k||0;S.sup+=u.sup||0;const it=u.item?giveItem(u.item):"";S.hp=cl(S.hp+(u.hp||0),1,S.mhp);S.mp=cl(S.mp+(u.mp||0),0,C[S.c].mp);S.pot+=u.pot||0;
 (u.fx||[]).forEach(addFx);
 const g=(u.fx||[]).map(i=>`${X[i].bad?"Debuff":"Buff"}: ${X[i].e} ${X[i].n} (${X[i].t}, ${X[i].l} batalhas)`);
 if(it)g.push(it);if(u.pot)g.push(`+${u.pot} poção`);
 story("Missão secundária",[u.x].concat(g.length?["<b>"+g.join(" · ")+"</b>"]:[]),[["Continuar",go]],{e:u.item?I[u.item].s:"quest",h:(u.fx||[]).some(i=>X[i].bad)?"><":"^^"});
}
function re(s){
 story("Acampamento",[s.x,"Aqui você pode se recuperar antes da próxima batalha."],[
  ["🏕️ Descansar <small>Gasta 1 ração e recupera tudo; sem rações, recupera só metade</small>",()=>{const f=S.sup>0?1:.5;if(S.sup>0)S.sup--;S.hp=Math.round(S.hp+(S.mhp-S.hp)*f);S.mp=Math.round(S.mp+(C[S.c].mp-S.mp)*f);S.fx=S.fx.filter(f=>f.id!="ven");story("Acampamento",["Você dorme e recupera as forças (rações restantes: "+S.sup+")."],[["Continuar",go]],{e:"fire",h:"^^"})}],
  ["🔥 Seguir direto <small>Não recupera nada, mas ganha Coragem (+20% de dano) na próxima batalha</small>",()=>{addFx("cor");go()}],
  ["🎒 Ver equipamento",()=>inv(()=>re(s))]
 ],{e:"fire"});
}
function fight(k){S.e={...E[k]};S.e.hp=S.e.mhp=Math.round(E[k].hp*(1.1+S.i*.01));S.log=["Um "+S.e.n+" aparece!"];S.pose={e:E[k].a||k};S.busy=false;turn()}
function turn(){
 const e=S.e,c=C[S.c],over=e.hp<=0,cost=c.cost+(has("mal")?1:0);
 app.innerHTML=`<div class="card"><div class="act">Combate</div><pre class="art">${scene(S.pose)}</pre><div class="lbl"><span>${e.e} ${e.n}</span><span>❤️ ${Math.max(0,e.hp)}/${e.mhp}</span></div><div class="bar"><i style="width:${Math.max(0,e.hp)/e.mhp*100}%;background:var(--hp)"></i></div>${h()}<div id="log">${S.log.slice(-4).map(l=>`<div>${l}</div>`).join("")}</div></div>`+
 (over?`<button id="n">Continuar</button>`:`<button id="a" ${S.busy?"disabled":""}>⚔️ Ataque básico</button><button id="s" ${S.mp<cost||S.busy?"disabled":""}>✨ ${c.sp} <small>Custa ${cost} de magia${c.heal?" · também cura "+c.heal:""}</small></button><button id="m" ${S.busy?"disabled":""}>🧘 Meditar <small>Recupera 4 de magia, mas perde o turno</small></button><button id="p" ${S.pot<1||S.busy?"disabled":""}>🧪 Usar poção <small>+25 de vida</small></button>`);
 const b=id=>document.getElementById(id);
 if(over){b("n").onclick=()=>{loot(e)};return}
 b("a").onclick=()=>act("a");b("s").onclick=()=>act("s");b("m").onclick=()=>act("m");b("p").onclick=()=>act("p");
}
function act(t){
 const e=S.e,c=C[S.c],M=C[S.c].mp;
 const dm=Math.max(.1,1+(has("ben")?.3:0)+(has("cor")?.2:0)-(has("fraq")?.25:0));
 let d;
 if(t=="a"){d=Math.round(r(c.atk)*dm)+bn("arma");e.hp-=d;S.log.push(`Você ataca e causa ${d} de dano.`);S.pose={e:S.pose.e,h:">>",f:"><",g:"=--->"}}
 if(t=="s"){S.mp-=c.cost+(has("mal")?1:0);d=Math.round(r(c.spd)*dm)+bn("arma");e.hp-=d;S.log.push(`${c.sp}! Você causa ${d} de dano.`);S.pose={e:S.pose.e,h:">>",f:"><",g:"*~*~>"};if(c.heal){S.hp=Math.min(S.mhp,S.hp+c.heal);S.log.push(`Você recupera ${c.heal} de vida.`)}}
 if(t=="m"){S.mp=Math.min(M,S.mp+4);S.log.push("Você respira fundo e recupera magia.");S.pose={e:S.pose.e,h:"^^",f:"oo",g:"~*~*~"}}
 if(t=="p"){S.pot--;S.hp=Math.min(S.mhp,S.hp+25);S.log.push("Você bebe a poção e recupera vida.");S.pose={e:S.pose.e,h:"^^",f:"oo",g:"+ + +"}}
 if(e.hp<=0){S.log.push(`${e.n} foi derrotado!`);S.pose={e:S.pose.e,h:"^^",f:"xx",g:""};turn();return}
 S.busy=true;turn();setTimeout(()=>{d=Math.max(1,Math.round(r(e.atk)*(1+S.i*.006)*(has("pele")?.7:1))-bn("armadura"));S.hp-=d;S.log.push(`${e.n} ataca e causa ${d} de dano.`);if(e.ef&&Math.random()<.3){addFx(e.ef);S.log.push(`${X[e.ef].e} Você sofreu: ${X[e.ef].n}!`)}
 if(has("ven")&&S.hp>0){S.hp=Math.max(1,S.hp-3);S.log.push("☠️ O veneno causa 3 de dano.")}
 S.busy=false;if(S.hp<=0){S.pose={e:S.pose.e,h:"xx",f:"OO",g:"<~~~~"};lose();return}
 S.mp=Math.min(M,S.mp+1+bn("botas")+(has("mente")?2:0));
 S.pose={e:S.pose.e,h:"><",f:"OO",g:"<~~~~"};turn()},650);
}
function lose(){story("Fim de jogo",["Suas forças acabaram e a escuridão toma conta de tudo. Valdoria continua sem esperança…"],[["🔁 Tentar de novo",start]],{e:S.pose&&S.pose.e,f:"OO",h:"xx",g:"<~~~~"})}
function win(){story("Final",["O Dragão Ignis solta um último rugido e desaba. Você pega o Cristal do Sol e ele ilumina toda a caverna.","De volta à aldeia, as plantações voltam a crescer. Todos cantam o nome do "+C[S.c].n+" que salvou Valdoria. 🎉"],[["🔁 Jogar de novo",start]],{e:"crystal",h:"^^",g:" * * "})}
start();
</script>
